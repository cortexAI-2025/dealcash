version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: dealcash-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealcash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealcash_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dealcash}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealcash']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dealcash-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealcash-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dealcash}:${POSTGRES_PASSWORD:-dealcash_secret}@db:5432/${POSTGRES_DB:-dealcash}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
